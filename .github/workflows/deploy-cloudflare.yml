name: Deploy to Cloudflare

# One-click CodFlow deploy: D1 + R2 + KV + 3 workers (API, dashboard, storefront).
# Implements .agents/skills/codflow-setup/SKILL.md via scripts/cloudflare-deploy.mjs.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    Cloudflare API token (Workers + D1 + R2 + KV write)
#   CLOUDFLARE_ACCOUNT_ID   32-hex Cloudflare account ID
#   ADMIN_PASSWORD          admin dashboard password (choose it yourself)
#
# Run: Actions → Deploy to Cloudflare → Run workflow (select this branch).

on:
  # Arena's GitHub integration cannot dispatch workflows directly. Pushing this
  # deployment branch therefore performs the requested full recovery upload.
  push:
    branches: [arena/01a0b487-codflowv2]
  workflow_dispatch:
    inputs:
      project_prefix:
        description: "Resource + worker name prefix (lowercase, digits, dashes)"
        default: "codflowv2"
        required: true
        type: string
      admin_email:
        description: "Admin login email"
        default: "admin@codflow.store"
        required: true
        type: string
      skip_seed:
        description: "Skip demo catalog seed (empty store)"
        default: false
        required: false
        type: boolean
      server_url:
        description: "API public URL; Wrangler binds its DNS + TLS during deploy"
        default: "https://api.codfly.dpdns.org"
        required: true
        type: string
      dashboard_url:
        description: "Dashboard public URL; Wrangler binds its DNS + TLS during deploy"
        default: "https://dashboard.codfly.dpdns.org"
        required: true
        type: string
      store_url:
        description: "Storefront public URL; Wrangler binds its DNS + TLS during deploy"
        default: "https://codfly.dpdns.org"
        required: true
        type: string
      media_domain:
        description: "R2 custom domain host; the deploy attempts to bind DNS + TLS automatically"
        default: "media.codfly.dpdns.org"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (runbook end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PROJECT_PREFIX: ${{ inputs.project_prefix || 'codflowv2' }}
      ADMIN_EMAIL: ${{ inputs.admin_email || 'admin@codflow.store' }}
      # These defaults keep every recovery upload on the requested domain,
      # whether started manually or by a push to the recovery branch.
      IN_SERVER_URL: ${{ inputs.server_url || 'https://api.codfly.dpdns.org' }}
      IN_DASHBOARD_URL: ${{ inputs.dashboard_url || 'https://dashboard.codfly.dpdns.org' }}
      IN_STORE_URL: ${{ inputs.store_url || 'https://codfly.dpdns.org' }}
      MEDIA_DOMAIN: ${{ inputs.media_domain || 'media.codfly.dpdns.org' }}
      # Optional R2 API token (repo secrets) — unlocks "Step 3b" image uploads:
      # cloudflare-deploy.mjs installs them as CF_ACCOUNT_ID / R2_ACCESS_KEY_ID /
      # R2_SECRET_ACCESS_KEY worker secrets when both are present.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preflight — required secrets present
        run: |
          missing=0
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::Missing repo secret CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "::error::Missing repo secret CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ -z "$ADMIN_PASSWORD" ] && { echo "::error::Missing repo secret ADMIN_PASSWORD (choose the admin password yourself)"; missing=1; }
          if [ "$missing" = 1 ]; then
            echo "Add them at: repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required secrets present."

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        # Build args from env (not ${{ }} interpolation) so input values never
        # reach the shell for evaluation. Empty inputs are simply omitted.
        run: |
          ARGS=()
          # flag() in cloudflare-deploy.mjs only understands --name=value (no space form)
          [ "${{ inputs.skip_seed }}" = "true" ] && ARGS+=(--skip-seed)
          [ -n "$IN_SERVER_URL" ]    && ARGS+=(--server-url="$IN_SERVER_URL")
          [ -n "$IN_DASHBOARD_URL" ] && ARGS+=(--dashboard-url="$IN_DASHBOARD_URL")
          [ -n "$IN_STORE_URL" ]     && ARGS+=(--store-url="$IN_STORE_URL")
          set -o pipefail
          node scripts/cloudflare-deploy.mjs "${ARGS[@]}" 2>&1 | tee "${{ runner.temp }}/cloudflare-deploy.log"
        env:
          CF_DEPLOY_OUTPUT_FILE: ${{ runner.temp }}/deploy-output.env

      - name: Preserve deploy diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-deploy-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-deploy.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Surface deploy failure in the check annotation
        if: failure()
        run: |
          LOG="$(tail -c 6000 "${{ runner.temp }}/cloudflare-deploy.log")"
          LOG="${LOG//'%'/'%25'}"
          LOG="${LOG//$'\r'/'%0D'}"
          LOG="${LOG//$'\n'/'%0A'}"
          echo "::error title=Cloudflare deploy diagnostics::$LOG"

      - name: Configure R2 CORS for presigned image uploads
        # One-time Step 3b automation: bucket-level CORS lets browsers PUT
        # images via presigned URLs. Non-blocking — the deploy itself is fine
        # without it, and it can be re-run any time.
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            CF_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" node scripts/setup-r2-cors.mjs \
              || echo "::warning::R2 CORS setup failed — run cod-server/scripts/setup-r2-cors.mjs manually"
          else
            echo "R2 API token secrets not set — skipping CORS setup (Step 3b)."
            echo "See: R2 → Manage R2 API Tokens → Create (Object Read & Write on ${PROJECT_PREFIX}-images),"
            echo "then add repo secrets R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY and re-run."
          fi
        working-directory: cod-server

      - name: Rotate admin API key (revoke key shown in logs)
        # seed-admin prints the admin API key to stdout; on a public repo that
        # lands in public logs, so rotate it to a fresh random value that is
        # never printed. The admin password itself comes from a secret and is
        # auto-masked by GitHub wherever it appears.
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process';
            import { randomBytes } from 'node:crypto';
            const db = process.env.PROJECT_PREFIX + '-db';
            const email = process.env.ADMIN_EMAIL;
            const key = 'cod_' + randomBytes(16).toString('hex');
            execFileSync('npx', ['wrangler', 'd1', 'execute', db, '--remote',
              '--command', \"UPDATE users SET api_key = '\" + key + \"' WHERE email = '\" + email + \"'\"],
              { stdio: 'pipe' });
            console.log('admin api_key rotated (old logged value revoked)');
          "

      - name: Publish deployment summary
        if: success()
        run: |
          # shellcheck disable=SC1090
          source "${{ runner.temp }}/deploy-output.env"
          {
            echo "# ✅ CodFlow deployed — ${PREFIX}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 🖥️ Dashboard | ${DASHBOARD_URL} |"
            echo "| 🔌 API | ${SERVER_URL} ([docs](${SERVER_URL}/api/docs)) |"
            echo "| 🛍️ Storefront | ${STOREFRONT_URL} |"
            echo "| 📧 Admin email | \`${ADMIN_EMAIL}\` |"
            echo "| 🔑 Admin password | the \`ADMIN_PASSWORD\` repo secret you set |"
            echo ""
            echo "Resources: D1 \`${D1_NAME}\` (${D1_ID}) · R2 \`${R2_BUCKET}\` · KV \`${KV_RATE_NAME}\`, \`${KV_OAUTH_NAME}\`"
            echo ""
            echo "> Next: R2 custom media domain + R2 API token for image uploads, and a custom API domain for the storefront catalog — see docs/CLOUDFLARE-DEPLOY.md."
          } >> "$GITHUB_STEP_SUMMARY"
